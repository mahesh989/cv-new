name: Deploy Frontend and Backend

on:
  push:
    branches: [ enhanced-vps-ghs ]
    paths:
      - 'cv-magic-app/mobile_app/**'
      - 'cv-magic-app/backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Check which paths changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            frontend:
              - 'cv-magic-app/mobile_app/**'
            backend:
              - 'cv-magic-app/backend/**'

  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    needs: changes
    # Run if frontend files changed OR if manually triggered
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # needed so git diff, versioning, and flutter build see history
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      
      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.pub-cache
            cv-magic-app/mobile_app/.dart_tool
            cv-magic-app/mobile_app/.flutter-plugins
            cv-magic-app/mobile_app/.flutter-plugins-dependencies
          key: ${{ runner.os }}-flutter-${{ hashFiles('cv-magic-app/mobile_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./cv-magic-app/mobile_app
      
      - name: Build web
        run: flutter build web --release --base-href="/cv-new/"
        working-directory: ./cv-magic-app/mobile_app
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cv-magic-app/mobile_app/build/web

  deploy-backend:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # needed so git diff HEAD~1 works for change detection

      - name: Resolve VPS hostname to IP (if needed)
        id: resolve-host
        timeout-minutes: 2
        run: |
          HOST="${{ secrets.VPS_HOST }}"
          # Check if it's already an IP address
          if [[ $HOST =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Using IP address directly: $HOST"
            echo "resolved_host=$HOST" >> $GITHUB_OUTPUT
          else
            echo "Resolving hostname: $HOST"
            # Try multiple DNS servers and methods with timeouts
            IP=""
            
            # Try getent (fastest, uses system resolver)
            if [ -z "$IP" ]; then
              IP=$(timeout 5 getent hosts $HOST 2>/dev/null | awk '{ print $1 }' | head -n1) || IP=""
            fi
            
            # Try Google DNS
            if [ -z "$IP" ]; then
              IP=$(timeout 5 dig +short +time=3 +tries=2 $HOST @8.8.8.8 2>/dev/null | tail -n1) || IP=""
            fi
            
            # Try Cloudflare DNS
            if [ -z "$IP" ]; then
              IP=$(timeout 5 dig +short +time=3 +tries=2 $HOST @1.1.1.1 2>/dev/null | tail -n1) || IP=""
            fi
            
            # Try nslookup as last resort
            if [ -z "$IP" ]; then
              IP=$(timeout 5 nslookup $HOST 8.8.8.8 2>/dev/null | grep -A1 "Name:" | tail -n1 | awk '{print $2}') || IP=""
            fi
            
            if [ -z "$IP" ]; then
              echo "⚠️ Warning: Could not resolve $HOST, will try hostname directly"
              echo "resolved_host=$HOST" >> $GITHUB_OUTPUT
            else
              echo "✅ Resolved $HOST to $IP"
              echo "resolved_host=$IP" >> $GITHUB_OUTPUT
            fi
          fi
      
      - name: Deploy Backend to VPS (Full Deployment)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ steps.resolve-host.outputs.resolved_host || secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            echo "🔍 Checking current directory and git status..."
            cd ~/cv-new/cv-magic-app
            
            echo "🧹 Clearing log files..."
            mkdir -p logs
            > logs/backend_logs.txt || true
            > logs/frontend_logs.txt || true
            echo "  ✅ Cleared backend_logs.txt and frontend_logs.txt"
            
            echo "📥 Pulling latest changes from enhanced-vps-ghs branch..."
            git fetch origin
            git checkout enhanced-vps-ghs
            git pull origin enhanced-vps-ghs
            
            # Check if requirements.txt or Dockerfile changed to determine if rebuild is needed
            REQUIREMENTS_CHANGED=false
            DOCKERFILE_CHANGED=false
            
            if git diff HEAD~1 HEAD --name-only | grep -q "backend/requirements.txt"; then
              REQUIREMENTS_CHANGED=true
              echo "  📦 requirements.txt changed - will rebuild Python dependencies"
            fi
            
            if git diff HEAD~1 HEAD --name-only | grep -q "backend/Dockerfile"; then
              DOCKERFILE_CHANGED=true
              echo "  🐳 Dockerfile changed - will rebuild Docker image"
            fi
            
            # Check if package.json exists and changed (for future Node.js services)
            if [ -f "backend/package.json" ]; then
              if git diff HEAD~1 HEAD --name-only | grep -q "backend/package.json"; then
                echo "  📦 package.json changed - will run npm install"
                NPM_INSTALL_NEEDED=true
              else
                NPM_INSTALL_NEEDED=false
              fi
            else
              NPM_INSTALL_NEEDED=false
            fi
            
            echo "🛑 Stopping existing containers..."
            echo "  - Preserving database and user data volumes..."
            docker compose down --remove-orphans || true
            
            # Only perform full cleanup if Dockerfile or requirements changed
            if [ "$REQUIREMENTS_CHANGED" = true ] || [ "$DOCKERFILE_CHANGED" = true ]; then
              echo "🧹 Performing Docker cleanup (dependencies changed)..."
              echo "  - Removing unused containers..."
              docker container prune -f || true
              
              echo "  - Removing unused images..."
              docker image prune -f || true
              
              echo "  - Removing unused networks..."
              docker network prune -f || true
              
              echo "  - Removing dangling images..."
              docker image prune -f --filter "dangling=true" || true
              
              echo "🔨 Building new containers (with --no-cache)..."
              docker compose build --no-cache
            else
              echo "🔨 Building containers (using cache - no dependency changes detected)..."
              docker compose build
            fi
            
            # If package.json exists and changed, install npm dependencies
            if [ "$NPM_INSTALL_NEEDED" = true ] && [ -f "backend/package.json" ]; then
              echo "📦 Installing npm dependencies..."
              docker compose exec -T backend npm install || echo "⚠️ npm install failed or not applicable"
            fi
            
            echo "🚀 Starting containers with zero-downtime strategy..."
            # Use rolling update: start new containers, then remove old ones
            docker compose up -d --no-deps --build backend || docker compose up -d
            
            # Wait a moment for new container to be ready
            sleep 5
            
            # Health check before fully switching
            if curl -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "  ✅ New backend container is healthy"
              # Now restart other dependent services if needed
              docker compose up -d
            else
              echo "  ⚠️ Health check failed, but continuing deployment..."
              docker compose up -d
            fi
            
            echo "⏳ Waiting for services to stabilize..."
            sleep 10
            
            echo "🔍 Checking container status..."
            docker compose ps
            
            echo "📋 Checking logs for any errors..."
            docker compose logs --tail=20
            
            echo "🌐 Testing backend connectivity..."
            curl -f http://localhost:8000/health || echo "⚠️ Health check failed, but deployment might still be successful"
            
            echo "📝 Starting log collection..."
            # Start logging in background (if not already running)
            nohup docker compose logs -f backend >> logs/backend_logs.txt 2>&1 &
            nohup docker compose logs -f nginx >> logs/frontend_logs.txt 2>&1 &
            echo "  ✅ Logs are being saved to logs/backend_logs.txt and logs/frontend_logs.txt"
            
            echo "✅ Full deployment completed!"
