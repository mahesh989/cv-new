name: Deploy Frontend and Backend

on:
  push:
    branches: [ enhanced-vps-ghs ]

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./cv-magic-app/mobile_app
      
      - name: Build web
        run: flutter build web --release --base-href="/cv-new/"
        working-directory: ./cv-magic-app/mobile_app
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./cv-magic-app/mobile_app/build/web

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-and-deploy-frontend  # Optional: run after frontend
    steps:
      - name: Deploy Backend to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd ~/cv-new/cv-magic-app
            git fetch origin
            git checkout enhanced-vps-ghs
            git pull origin enhanced-vps-ghs
            docker compose down --remove-orphans || true
            docker compose build --no-cache
            docker compose up -d
            sleep 10
            docker compose ps
            curl -f http://localhost:8000/health || echo "Health check failed, but deployment might still be successful"
